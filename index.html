<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>musulmani.org — I musulmani in Italia</title>
  <meta name="description" content="Una sola ummah. Un solo posto. Storie, notizie e sapere dall'Islam per i musulmani in Italia.">
  <link rel="icon" href="favicon.png">
  <meta property="og:title" content="musulmani.org">
  <meta property="og:description" content="Una sola ummah. Un solo posto. Il sito è in costruzione.">
  <meta property="og:image" content="https://musulmani.org/logo.png">
  <style>
    :root { --navy: #05264B; --deep: #031A36; --peach: #FFB88C; --cream: #FFF3E8; }
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px;
      background: radial-gradient(circle at 50% 35%, var(--navy), var(--deep) 75%); color: var(--cream);
      font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; text-align: center;
    }
    main { max-width: 520px; }
    img { width: 140px; height: 140px; }
    h1 { font-size: 44px; letter-spacing: -1px; margin-top: 16px; }
    h1 span { color: var(--peach); font-weight: 500; }
    .tag { letter-spacing: 6px; font-size: 13px; opacity: .7; margin-top: 6px; }
    .motto { font-size: 22px; font-weight: 600; margin-top: 36px; }
    .wip { margin-top: 14px; opacity: .8; line-height: 1.5; }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 32px; }
    a {
      color: var(--peach); text-decoration: none; font-weight: 600; padding: 12px 22px;
      border: 2px solid var(--peach); border-radius: 999px;
    }
    a:hover { background: var(--peach); color: var(--deep); }
    footer { margin-top: 48px; font-size: 13px; opacity: .5; }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="Logo di musulmani.org">
    <h1>musulmani<span>.org</span></h1>
    <p class="tag">I MUSULMANI IN ITALIA</p>
    <p class="motto">Una sola ummah. Un solo posto.</p>
    <p class="wip">Il sito è nuovo e ci stiamo ancora lavorando, in sha Allah.<br>Nel frattempo seguici qui:</p>
    <div class="links">
      <a href="https://www.instagram.com/musulmani.org/">Instagram</a>
      <a href="https://www.tiktok.com/@musulmani.org">TikTok</a>
    </div>
    <footer>© 2026 musulmani.org</footer>
  </main>
</body>
</html>
