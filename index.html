<head>

  <link rel="icon" href="favicon.png">

  <meta property="og:image" content="https://musulmani.org/logo.png">
  <style>
    :root { --navy: #05264B; --deep: #031A36; --peach: #FFB88C; --cream: #FFF3E8; }
    * { box-sizing: border-box; margin: 0; }
    body {
      position: relative; overflow-x: hidden;
      min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 32px 16px;
      background: var(--navy); color: var(--cream);
      font-family: "Avenir Next", "Helvetica Neue", Arial, sans-serif; text-align: center;
    }
    /* Stelle lente e alone di luce dietro il logo, come nel video */
    body::before {
      content: ""; position: fixed; inset: 0; pointer-events: none; opacity: .5;
      background-image:
        radial-gradient(1.5px 1.5px at 12% 18%, var(--cream), transparent), radial-gradient(1px 1px at 78% 12%, var(--cream), transparent),
        radial-gradient(1.5px 1.5px at 64% 72%, var(--peach), transparent), radial-gradient(1px 1px at 22% 82%, var(--cream), transparent),
        radial-gradient(1px 1px at 88% 58%, var(--cream), transparent), radial-gradient(1.5px 1.5px at 40% 34%, var(--peach), transparent),
        radial-gradient(1px 1px at 8% 52%, var(--cream), transparent), radial-gradient(1px 1px at 52% 92%, var(--cream), transparent);
      animation: twinkle 6s ease-in-out infinite alternate;
    }
    @keyframes twinkle { from { opacity: .25; } to { opacity: .6; } }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes breathe { 0%, 100% { opacity: .55; transform: scale(1); } 50% { opacity: .85; transform: scale(1.06); } }
    main { width: 100%; max-width: 520px; position: relative; }
    main > * { animation: rise .9s ease-out both; }
    main > *:nth-child(2) { animation-delay: .1s; } main > *:nth-child(3) { animation-delay: .2s; }
    main > *:nth-child(4) { animation-delay: .35s; } main > *:nth-child(5) { animation-delay: .5s; }
    main > *:nth-child(6) { animation-delay: .65s; } main > *:nth-child(7) { animation-delay: .8s; } main > *:nth-child(8) { animation-delay: .9s; }
    .logo { position: relative; width: 160px; height: 160px; margin: 0 auto; }
    .logo::before {
      content: ""; position: absolute; inset: -70px; border-radius: 50%;
      background: radial-gradient(circle, rgba(255,184,140,.35), transparent 65%); animation: breathe 5s ease-in-out infinite;
    }
    .logo img { position: relative; width: 160px; height: 160px; }
    .line { width: 60px; height: 1px; background: var(--peach); opacity: .5; margin: 30px auto 0; }
    @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important; } }
    h1 { font-size: 44px; letter-spacing: -1px; margin-top: 16px; }
    h1 span { color: var(--peach); font-weight: 500; }
    .tag { letter-spacing: 6px; font-size: 13px; opacity: .7; margin-top: 6px; }
    .motto { font-size: 24px; font-weight: 600; margin-top: 26px; letter-spacing: -.3px; }
    .wip { margin-top: 14px; opacity: .8; line-height: 1.5; }
    .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 32px; }
    .invite { font-size: 19px; color: var(--peach); font-weight: 600; margin-top: 24px; line-height: 1.4; }
    a {
      display: inline-flex; align-items: center; gap: 10px; color: var(--navy); background: var(--peach);
      text-decoration: none; font-weight: 700; padding: 13px 24px; border-radius: 999px;
    }
    a svg { width: 22px; height: 22px; fill: var(--navy); }
    a { transition: background .25s, transform .25s; box-shadow: 0 0 24px rgba(255,184,140,.25); }
    a:hover { background: var(--cream); transform: translateY(-2px); }
    footer { margin-top: 48px; font-size: 13px; opacity: .5; }
  </style>
